  <script>
    /* Flutter's engine (full-page mode) deletes every <meta name=viewport> at startup and appends its own,
       "width=device-width, initial-scale=1.0, maximum-scale=5.0", which gives the zoom back. Keep the
       engine's meta but pin its scale: maximum-scale=1, user-scalable=no (no focus zoom, no sideways drift). */
    (function () {
      function pin() {
        var ms = document.head.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < ms.length; i++) {
          var c = ms[i].getAttribute("content") || "";
          if (/maximum-scale=1(\.0)?(,|$)/.test(c) && /user-scalable=no/.test(c)) continue;
          ms[i].setAttribute("content", c.replace(/,?\s*(maximum-scale|user-scalable)=[^,]*/g, "") + ", maximum-scale=1, user-scalable=no");
        }
      }
      new MutationObserver(pin).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ["content"] });
      pin();
    })();
  </script>

    html, body { margin: 0; background: #12141C; }

       input to the same floor, whatever it is handed. */
    input, textarea, flt-text-editing-host input, flt-text-editing-host textarea { font-size: 16px !important; }
    /* The boot screen (T-064 boot). Static HTML, so it is on screen from the
       first paint, before any script: the crest, shining, and the wordmark. It stays
       until Flutter reports its first frame. */
    #boot { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px; box-sizing: border-box; background: #12141C; color: #fff;
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; transition: opacity .25s; }

    #boot .est { font-size: 11px; font-weight: 600; letter-spacing: 0.2em; color: #A9AEC2; }
    /* The crest: a slow 3D tilt (a coin turning in the light), a soft top-left to bottom-right depth shade, and a
       sheen that sweeps left to right across the shield, clipped to its shape. No numbers: it is only a wait. */
    #boot .crest { width: 112px; height: 125px; perspective: 520px; }
    #boot .crest svg { display: block; width: 100%; height: 100%; overflow: visible; transform-origin: 50% 55%;
      filter: drop-shadow(0 12px 16px rgba(0,0,0,.55)); animation: bootTilt 4.2s ease-in-out infinite; }
    #boot .sheen { animation: bootSheen 2.6s cubic-bezier(.45,.05,.35,1) infinite; }
    @keyframes bootTilt { 0%, 100% { transform: rotateY(-24deg) rotateX(4deg); } 50% { transform: rotateY(24deg) rotateX(-3deg); } }
    @keyframes bootSheen { 0% { transform: translateX(-120px) skewX(-18deg); } 62%, 100% { transform: translateX(330px) skewX(-18deg); } }
    @media (prefers-reduced-motion: reduce) { #boot .crest svg, #boot .sheen { animation: none; } #boot .sheen { opacity: 0; } }

    #boot.gone { opacity: 0; pointer-events: none; }
