name: app
description: "Brickford as a Flutter app (T-064). Web at /brickford/app/, Android later."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Listed folder by folder, never `assets/` whole: the built web app is copied
  # into this same folder for GitHub Pages (tools/build-app.sh), and its own
  # assets/ output must not be bundled back in.
  assets:
    - assets/data/
    - assets/fonts/inter/
    - assets/fonts/playfair/
