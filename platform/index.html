<!-- Home-screen install. Every path here is RELATIVE: the site is served from a
     subpath (…/brickford/platform/), so a leading slash would resolve to the
     domain root and 404. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfd">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1216">
<link rel="manifest" href="manifest.json?v=20260812a">
<!-- iOS reads the apple-* pair; `mobile-web-app-capable` is the standard one that
     replaced it. Both, because Safari still honours only its own. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brickford">
<!-- Must be a PNG. Safari ignores SVG for apple-touch-icon, which is why these
     are real files rather than the inline data URI the favicon uses. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20260812a">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20260812a">
<title>Brickford</title>
<!-- Browser tab: the SAME full crest as the home-screen icon, at the sizes
     browsers actually request. PNG rather than the previous inline SVG,
     because an SVG gets scaled to 16px and the laurels turn to mud —
     rendering each size separately means 32px (what retina tabs use) is
     drawn properly instead of squeezed. -->
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png?v=20260812a">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=20260812a">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=20260812a">
