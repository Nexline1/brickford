<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Home-screen install. Every path here is RELATIVE: the site is served from a
     subpath (…/brickford/platform/), so a leading slash would resolve to the
     domain root and 404. -->
<!-- theme-color follows --panel, the sidebar's solid fill, for the status bar
     and the app icon. This is the default (dark) theme's --panel; the script
     below swaps in the stored theme's before the first paint, and
     applyTheme() in app.js keeps it. -->
<meta name="theme-color" content="#1e2230">
<!-- The theme, before the first paint (T-024). app.js is deferred behind the
     KaTeX CDN, so the static data-theme above would paint on its own until it
     ran: every device with "light" stored would flash dark and then flip to
     light. This reads the stored pick — READ ONLY, nothing is written — and
     resolves it the way app.js does: a stored "light" without the
     themeNavyOnce marker is the old default and paints dark (the T-024
     switch, see app.js load), "auto" follows the phone, unset is the dark
     default, and anything that is not a theme any more (parchment, forest,
     midnight, latte, slate, or any unknown string; T-025) paints dark. The
     stored value is left as it is until the next pick from the menu.
     PANEL is each theme's --panel in css/style.css; tools/verify-design.js
     checks the map against the stylesheet, so the two cannot drift apart. -->
<script>
(function () {
  var PANEL = { light: "#ffffff", dark: "#1e2230" };
  var pick;
  try {
    var st = (JSON.parse(localStorage.getItem("darhikmah_v1") || "{}").settings || {});
    pick = st.theme;
    // The T-024 switch, as app.js applies it at load: a stored "light"
    // without the per-device marker is the old default, and paints dark.
    if (pick === "light" && !st.themeNavyOnce) pick = null;
  } catch (e) { pick = null; }
  pick = pick || "dark";
  var theme = pick === "auto"
    ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    : pick;
  // A removed theme or any unknown string is dark (T-025).
  if (!Object.prototype.hasOwnProperty.call(PANEL, theme)) theme = "dark";
  document.documentElement.setAttribute("data-theme", theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", PANEL[theme]);
})();
</script>
<link rel="manifest" href="manifest.json?v=20261130a">
<!-- iOS reads the apple-* pair; `mobile-web-app-capable` is the standard one that
     replaced it. Both, because Safari still honours only its own. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent lets the dark panel run under the status bar instead of

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brickford">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261130a">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20261130a">

     is the frame and the page carries its own folio.

     a capsule with the day and week. The page's own h1 is the large title in
     the flow below; the name here stays transparent until that title has
     scrolled under the bar. mountTopbar() fills it from the rendered view and
     watchTopbar() decides when the name and the bottom hairline show.
